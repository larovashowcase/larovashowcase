<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');
        </style>
        <link rel="stylesheet" href="style.css" />
        <title>Larova Showcase Generator</title>
        <script src="script.js" type="text/javascript" defer></script>
    </head>
    <body>
        <div class="heading">
            <img src="larova-logo.png" class="heading__image" />
            <h1 class="heading__title">Larova Showcase Generator</h1>
            <h3 class="heading__subtitle">Automatically generate showcases for outfits.</h3>
        </div>
        <p class="note">
            Pick a card, upload your shirt and pants, then press Download.
        </p>
        <canvas class="display" width="700" height="373"></canvas>
        <div class="settings">
            <div class="setting">
                <label class="setting__display" for="card">Card:</label>
                <select class="setting__select" id="card" cardSelect>
                    <option value="showcaseTemplate.png">Ingeld</option>
                    <option value="cards/city-watch.png">City Watch</option>
                    <option value="cards/dasmant.png">Dasmant</option>
                    <option value="cards/jequis.png">Jequis</option>
                    <option value="cards/lost-men.png">Lost Men</option>
                </select>
            </div>
            <div class="setting">
                <p class="setting__display" settingDisplay setting="shirt">Shirt:</p>
                <button class="setting__button" uploadButton setting="shirt">Upload</button>
            </div>
            <div class="setting">
                <p class="setting__display" settingDisplay setting="pants">Pants:</p>
                <button class="setting__button" uploadButton setting="pants">Upload</button>
            </div>
            <div class="setting">
                <p class="setting__display" settingDisplay>Color:</p>
                <input type="text" class="setting__text-input" colorInput />
            </div>
            <button class="setting__button" downloadButton>Download</button>
        </div>
    </body>
</html>
